PACKAGE_NAME="nvidia-open-p2p"
PACKAGE_VERSION="615.71.09"
AUTOINSTALL="yes"

# Build from the repo root (not kernel-open/): the top-level Makefile first
# compiles src/nvidia + src/nvidia-modeset (nv-kernel.o / nv-modeset-kernel.o,
# symlinked as *.o_binary into kernel-open/) and then descends into kernel-open/
# for the Kbuild phase.
#
# The 'make' command name is quoted per dkms(8) so DKMS does not append
# KERNELRELEASE to the command line (which would make kernel-open/Makefile
# think it was invoked via Kbuild directly). KERNEL_UNAME is passed instead,
# and kernel-open/Makefile resolves /lib/modules/<ver>/build from it.
#
# nvidia-peermem (GPUDirect RDMA, needs MLNX_OFED headers) and nvidia-vgpu-vfio
# (vGPU) are excluded. What remains: nvidia, nvidia-uvm, nvidia-modeset,
# nvidia-drm. Peermem exclusion uses NV_EXCLUDE_KERNEL_MODULES, the variable
# actually consumed by kernel-open/Makefile (the kernel-open/dkms.conf template
# shipped for nvidia-installer references a different, inoperative name).
MAKE[0]="'make' -j${parallel_jobs} NV_EXCLUDE_KERNEL_MODULES='nvidia-peermem nvidia-vgpu-vfio' KERNEL_UNAME=${kernelver} modules"
# Note: no CLEAN directive — CLEAN is obsolete in DKMS >= 3.x, which rebuilds
# from a fresh copy of the source tree each time.

BUILT_MODULE_NAME[0]="nvidia"
BUILT_MODULE_LOCATION[0]="kernel-open/"
# NOTE: overridden to /updates/dkms on Arch/CachyOS by DKMS itself
# (override_dest_module_location); kept as /extramodules for distros
# without an override rule.
DEST_MODULE_LOCATION[0]="/extramodules"

BUILT_MODULE_NAME[1]="nvidia-uvm"
BUILT_MODULE_LOCATION[1]="kernel-open/"
DEST_MODULE_LOCATION[1]="/extramodules"

BUILT_MODULE_NAME[2]="nvidia-modeset"
BUILT_MODULE_LOCATION[2]="kernel-open/"
DEST_MODULE_LOCATION[2]="/extramodules"

BUILT_MODULE_NAME[3]="nvidia-drm"
BUILT_MODULE_LOCATION[3]="kernel-open/"
DEST_MODULE_LOCATION[3]="/extramodules"

# Secure Boot / MOK signing (disabled for now, see README):
# Generate a MOK key once with:
#   openssl req -new -x509 -newkey rsa:2048 -keyout /root/MOK.priv -outform DER \
#     -out /root/MOK.der -nodes -days 36500 -subj "/CN=nvidia-open-p2p/"
#   mokutil --import /root/MOK.der
# then uncomment:
# POST_BUILD="sign-file.sh"
